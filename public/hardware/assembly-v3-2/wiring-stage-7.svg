<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 960" width="1420" height="960" role="img" aria-label="Every jumper, end to end"><style>text{font:17px system-ui,sans-serif;fill:#293f34}.title{font-size:28px;font-weight:650}.small{font-size:13px}.pin{font-size:15px;font-weight:600}.id{font-size:12px;font-weight:750}.wire{cursor:pointer}.wire path{fill:none;stroke-linecap:round;stroke-linejoin:round}.wire.faded{opacity:.08}.wire.selected path.colour{stroke-width:6}.wire.selected text{font-size:15px}</style><rect width="1420" height="960" fill="#f6f4ee"/><text x="30" y="40" class="title">Every jumper, end to end</text><text x="30" y="70" class="small">Logical label panels — match the labels on your actual boards. W11 is conditional. Wire crossings are not junctions.</text><rect x="520" y="110" width="330" height="650" rx="12" fill="#e9e7dd" stroke="#a4afa0"/><text x="540" y="105" class="pin">Breadboard A–E side</text><text x="555" y="150">A</text><text x="605" y="150">B</text><text x="655" y="150">C</text><text x="705" y="150">D</text><text x="755" y="150">E</text><rect x="542" y="181" width="237" height="38" rx="14" fill="#bb493d" opacity=".12"/><path d="M560 200H760" stroke="#bb493d" stroke-width="10" opacity=".22"/><text x="795" y="205" class="pin">1</text><circle cx="560" cy="200" r="7" fill="#f6f4ee" stroke="#bb493d" stroke-width="2"/><circle cx="610" cy="200" r="7" fill="#f6f4ee" stroke="#bb493d" stroke-width="2"/><circle cx="660" cy="200" r="7" fill="#f6f4ee" stroke="#bb493d" stroke-width="2"/><circle cx="710" cy="200" r="7" fill="#f6f4ee" stroke="#bb493d" stroke-width="2"/><circle cx="760" cy="200" r="7" fill="#f6f4ee" stroke="#bb493d" stroke-width="2"/><text x="540" y="252" class="small">Row 1: +5V</text><rect x="542" y="331" width="237" height="38" rx="14" fill="#374b43" opacity=".12"/><path d="M560 350H760" stroke="#374b43" stroke-width="10" opacity=".22"/><text x="795" y="355" class="pin">3</text><circle cx="560" cy="350" r="7" fill="#f6f4ee" stroke="#374b43" stroke-width="2"/><circle cx="610" cy="350" r="7" fill="#f6f4ee" stroke="#374b43" stroke-width="2"/><circle cx="660" cy="350" r="7" fill="#f6f4ee" stroke="#374b43" stroke-width="2"/><circle cx="710" cy="350" r="7" fill="#f6f4ee" stroke="#374b43" stroke-width="2"/><circle cx="760" cy="350" r="7" fill="#f6f4ee" stroke="#374b43" stroke-width="2"/><text x="540" y="402" class="small">Row 3: common ground</text><rect x="542" y="481" width="237" height="38" rx="14" fill="#b47b17" opacity=".12"/><path d="M560 500H760" stroke="#b47b17" stroke-width="10" opacity=".22"/><text x="795" y="505" class="pin">5</text><circle cx="560" cy="500" r="7" fill="#f6f4ee" stroke="#b47b17" stroke-width="2"/><circle cx="610" cy="500" r="7" fill="#f6f4ee" stroke="#b47b17" stroke-width="2"/><circle cx="660" cy="500" r="7" fill="#f6f4ee" stroke="#b47b17" stroke-width="2"/><circle cx="710" cy="500" r="7" fill="#f6f4ee" stroke="#b47b17" stroke-width="2"/><circle cx="760" cy="500" r="7" fill="#f6f4ee" stroke="#b47b17" stroke-width="2"/><text x="540" y="552" class="small">Row 5: GPIO18 / servo signal</text><rect x="542" y="631" width="237" height="38" rx="14" fill="#397ab2" opacity=".12"/><path d="M560 650H760" stroke="#397ab2" stroke-width="10" opacity=".22"/><text x="795" y="655" class="pin">7</text><circle cx="560" cy="650" r="7" fill="#f6f4ee" stroke="#397ab2" stroke-width="2"/><circle cx="610" cy="650" r="7" fill="#f6f4ee" stroke="#397ab2" stroke-width="2"/><circle cx="660" cy="650" r="7" fill="#f6f4ee" stroke="#397ab2" stroke-width="2"/><circle cx="710" cy="650" r="7" fill="#f6f4ee" stroke="#397ab2" stroke-width="2"/><circle cx="760" cy="650" r="7" fill="#f6f4ee" stroke="#397ab2" stroke-width="2"/><text x="540" y="702" class="small">Row 7: GPIO19 / IN (conditional)</text><text x="540" y="795" class="small">One row = five connected holes.</text><text x="540" y="820" class="small">Different rows stay separate.</text><text x="540" y="845" class="small">Long power rails are not used.</text><rect x="30" y="150" width="260" height="270" rx="12" fill="#dce5dc" stroke="#97aa99"/><text x="50" y="185" class="pin">USB-C ESP32</text><text x="50" y="210" class="small">Separate from breadboard</text><path d="M75 105V150" stroke="#778a7b" stroke-width="9"/><text x="40" y="100" class="small">MacBook → USB-C data cable</text><text x="50" y="245">GND</text><text x="50" y="295">GPIO18 / D18</text><text x="50" y="345">GPIO19 / D19</text><text x="50" y="390" class="small">External +5V does not enter</text><text x="50" y="409" class="small">ESP32 VIN / 3V3 / GPIO.</text><rect x="30" y="520" width="260" height="235" rx="12" fill="#e7e4d7" stroke="#ada68d"/><text x="50" y="553" class="pin">5V brick + USB-A adapter</text><rect x="48" y="565" width="63" height="43" rx="4" fill="#f6f4ee" stroke="#777"/><text x="60" y="591" class="small">USB-A</text><rect x="111" y="576" width="22" height="21" fill="#b3bbb3"/><rect x="133" y="570" width="39" height="33" fill="#4b7057"/><text x="190" y="604" class="pin">+5V</text><text x="190" y="654" class="pin">GND</text><text x="50" y="698" class="small">D+ and D− stay EMPTY.</text><text x="50" y="727" class="small">Read real terminal markings.</text><rect x="1100" y="150" width="280" height="260" rx="12" fill="#dce3ec" stroke="#91a4b8"/><text x="1120" y="185" class="pin">SG90 factory cable/socket</text><text x="1120" y="234">Red → +5V</text><text x="1120" y="284">Brown/black → GND</text><text x="1120" y="334">Orange/yellow → signal</text><text x="1120" y="375" class="small">Male jumper pins go into</text><text x="1120" y="397" class="small">the existing female socket.</text><rect x="1100" y="520" width="280" height="235" rx="12" fill="#dce5dc" stroke="#97aa99"/><text x="1120" y="556" class="pin">5V vibration driver module</text><text x="1120" y="604">VCC / +</text><text x="1120" y="654">GND / −</text><text x="1120" y="704">IN / S  *</text><text x="1120" y="735" class="small">Header order NOT verified.</text><g class="wire faded" data-wire="W01"><title>W01: USB-A adapter +5V / VCC / VBUS → A1</title><path d="M290 600 L360 600 L360 200 L560 200" stroke="#f6f4ee" stroke-width="9"/><path class="colour" d="M290 600 L360 600 L360 200 L560 200" stroke="#bb493d" stroke-width="3.5"/><circle cx="560" cy="200" r="5" fill="#bb493d"/><text x="298" y="592" class="id" fill="#bb493d">W01</text><text x="548" y="187" class="id">W01</text></g><g class="wire faded" data-wire="W02"><title>W02: USB-A adapter GND / − → A3</title><path d="M290 650 L390 650 L390 350 L560 350" stroke="#f6f4ee" stroke-width="9"/><path class="colour" d="M290 650 L390 650 L390 350 L560 350" stroke="#374b43" stroke-width="3.5"/><circle cx="560" cy="350" r="5" fill="#374b43"/><text x="298" y="642" class="id" fill="#374b43">W02</text><text x="548" y="337" class="id">W02</text></g><g class="wire faded" data-wire="W03"><title>W03: ESP32 GND → B3</title><path d="M290 240 L420 240 L420 320 L610 320 L610 350" stroke="#f6f4ee" stroke-width="9"/><path class="colour" d="M290 240 L420 240 L420 320 L610 320 L610 350" stroke="#374b43" stroke-width="3.5"/><circle cx="610" cy="350" r="5" fill="#374b43"/><text x="298" y="232" class="id" fill="#374b43">W03</text><text x="598" y="337" class="id">W03</text></g><g class="wire faded" data-wire="W04"><title>W04: ESP32 GPIO18 / IO18 / D18 → A5</title><path d="M290 290 L450 290 L450 500 L560 500" stroke="#f6f4ee" stroke-width="9"/><path class="colour" d="M290 290 L450 290 L450 500 L560 500" stroke="#b47b17" stroke-width="3.5"/><circle cx="560" cy="500" r="5" fill="#b47b17"/><text x="298" y="282" class="id" fill="#b47b17">W04</text><text x="548" y="487" class="id">W04</text></g><g class="wire faded" data-wire="W05"><title>W05: ESP32 GPIO19 / IO19 / D19 → A7</title><path d="M290 340 L480 340 L480 650 L560 650" stroke="#f6f4ee" stroke-width="9"/><path class="colour" d="M290 340 L480 340 L480 650 L560 650" stroke="#397ab2" stroke-width="3.5"/><circle cx="560" cy="650" r="5" fill="#397ab2"/><text x="298" y="332" class="id" fill="#397ab2">W05</text><text x="548" y="637" class="id">W05</text></g><g class="wire selected" data-wire="W06"><title>W06: SG90 red lead, female servo socket → B1</title><path d="M1100 230 L970 230 L970 170 L610 170 L610 200" stroke="#f6f4ee" stroke-width="9"/><path class="colour" d="M1100 230 L970 230 L970 170 L610 170 L610 200" stroke="#bb493d" stroke-width="3.5"/><circle cx="610" cy="200" r="5" fill="#bb493d"/><text x="1053" y="222" class="id" fill="#bb493d">W06</text><text x="598" y="187" class="id">W06</text></g><g class="wire selected" data-wire="W07"><title>W07: SG90 brown / black lead, female servo socket → C3</title><path d="M1100 280 L1000 280 L1000 380 L660 380 L660 350" stroke="#f6f4ee" stroke-width="9"/><path class="colour" d="M1100 280 L1000 280 L1000 380 L660 380 L660 350" stroke="#374b43" stroke-width="3.5"/><circle cx="660" cy="350" r="5" fill="#374b43"/><text x="1053" y="272" class="id" fill="#374b43">W07</text><text x="648" y="337" class="id">W07</text></g><g class="wire selected" data-wire="W08"><title>W08: SG90 orange / yellow lead, female servo socket → B5</title><path d="M1100 330 L1030 330 L1030 530 L610 530 L610 500" stroke="#f6f4ee" stroke-width="9"/><path class="colour" d="M1100 330 L1030 330 L1030 530 L610 530 L610 500" stroke="#b47b17" stroke-width="3.5"/><circle cx="610" cy="500" r="5" fill="#b47b17"/><text x="1053" y="322" class="id" fill="#b47b17">W08</text><text x="598" y="487" class="id">W08</text></g><g class="wire faded" data-wire="W09"><title>W09: Vibration module VCC / + → C1</title><path d="M1100 600 L940 600 L940 125 L660 125 L660 200" stroke="#f6f4ee" stroke-width="9"/><path class="colour" d="M1100 600 L940 600 L940 125 L660 125 L660 200" stroke="#bb493d" stroke-width="3.5"/><circle cx="660" cy="200" r="5" fill="#bb493d"/><text x="1053" y="592" class="id" fill="#bb493d">W09</text><text x="648" y="187" class="id">W09</text></g><g class="wire faded" data-wire="W10"><title>W10: Vibration module GND / − → D3</title><path d="M1100 650 L910 650 L910 410 L710 410 L710 350" stroke="#f6f4ee" stroke-width="9"/><path class="colour" d="M1100 650 L910 650 L910 410 L710 410 L710 350" stroke="#374b43" stroke-width="3.5"/><circle cx="710" cy="350" r="5" fill="#374b43"/><text x="1053" y="642" class="id" fill="#374b43">W10</text><text x="698" y="337" class="id">W10</text></g><g class="wire faded" data-wire="W11"><title>W11: Vibration module IN / S / signal → B7</title><path d="M1100 700 L880 700 L880 680 L610 680 L610 650" stroke="#f6f4ee" stroke-width="9"/><path class="colour" d="M1100 700 L880 700 L880 680 L610 680 L610 650" stroke="#397ab2" stroke-width="3.5" stroke-dasharray="9 6"/><circle cx="610" cy="650" r="5" fill="#397ab2"/><text x="1053" y="692" class="id" fill="#397ab2">W11</text><text x="598" y="637" class="id">W11</text></g><rect x="548" y="132" width="24" height="24" fill="#f6f4ee"/><text x="555" y="150">A</text><rect x="598" y="132" width="24" height="24" fill="#f6f4ee"/><text x="605" y="150">B</text><rect x="648" y="132" width="24" height="24" fill="#f6f4ee"/><text x="655" y="150">C</text><rect x="698" y="132" width="24" height="24" fill="#f6f4ee"/><text x="705" y="150">D</text><rect x="748" y="132" width="24" height="24" fill="#f6f4ee"/><text x="755" y="150">E</text><text x="30" y="895" class="pin">* W11: leave IN disconnected until this module’s 3.3V control input compatibility is verified.</text><text x="30" y="927" class="small">Jumpers: 6 female–male + 5 male–male. Colours are suggestions; servo factory lead colours identify its three functions.</text></svg>