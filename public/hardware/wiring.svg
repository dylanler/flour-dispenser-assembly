<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><style>text{font-family:system-ui,sans-serif;fill:#293e34;font-size:18px}.small{font-size:14px}.title{font-size:30px;font-weight:600}.label{font-size:21px;font-weight:600}.wire{fill:none;stroke-width:4;stroke-linejoin:round}.red{stroke:#b94a3f}.gnd{stroke:#33433c}.signal{stroke:#dca14d}.pwm{stroke:#437ea8}</style><rect width="1100" height="650" fill="#f5f3ed"/><text x="40" y="55" class="title">Flour / V2 · power and control</text><text x="40" y="87" class="small">Schematic only — use printed pin labels. Disconnect power while wiring.</text><rect x="40" y="150" width="240" height="190" rx="12" fill="#dce5d7"/><text x="60" y="190" class="label">USB-C ESP32</text><text x="60" y="220" class="small">USB powers/programs board</text><text x="190" y="255">GPIO18</text><text x="190" y="290">GPIO19</text><text x="215" y="325">GND</text><rect x="380" y="390" width="340" height="125" rx="10" fill="#e5dfce"/><text x="400" y="420" class="label">400-point breadboard</text><path d="M400 447H700" class="wire red"/><path d="M400 482H700" class="wire gnd"/><text x="420" y="441" class="small">+5V bus</text><text x="420" y="507" class="small">Common ground bus</text><rect x="40" y="390" width="240" height="125" rx="10" fill="#e5e9de"/><text x="60" y="425" class="label">USB-A brick</text><text x="60" y="453" class="small">5V + 4-terminal adapter</text><text x="60" y="482" class="small">+5V / GND only; D+ / D- empty</text><rect x="820" y="140" width="240" height="135" rx="12" fill="#dce1ed"/><text x="840" y="177" class="label">SG90 servo</text><text x="840" y="205" class="small">Orange/yellow = signal</text><text x="840" y="230" class="small">Red = +5V</text><text x="840" y="255" class="small">Brown/black = GND</text><rect x="820" y="320" width="240" height="150" rx="12" fill="#dce5d7"/><text x="840" y="357" class="label">5V vibration module</text><text x="840" y="385" class="small">IN / S = PWM control*</text><text x="840" y="410" class="small">VCC / + = +5V</text><text x="840" y="440" class="small">GND / − = common ground</text><path d="M280 250H760V200H820" class="wire signal"/><path d="M280 285H750V380H820" class="wire pwm"/><path d="M280 320H330V482H400M280 482H400M700 482H785V250H820M785 435H820" class="wire gnd"/><path d="M280 447H400M700 447H770V225H820M770 405H820" class="wire red"/><text x="40" y="565" class="small">* Confirm this actual module accepts 3.3V logic on IN with a 5V supply. No buffer is included.</text><text x="40" y="591" class="small">Never connect external +5V to ESP32 GPIO/3V3/USB power. Motor and servo do not use GPIO power.</text><text x="40" y="617" class="small">Breadboard right outer wall · ESP32 left outer wall · keep clip tabs, scale and front robot approach clear.</text></svg>
