<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490">
<style>text{font-family:Arial,sans-serif;fill:#293f34;font-size:17px}.title{font-size:28px;font-weight:600}.small{font-size:14px}.wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1120" height="490" fill="#f5f3ed"/>
<text x="35" y="48" class="title">USB-A power connection · no cutting or soldering</text>
<text x="35" y="80" class="small">Illustration only. Follow the actual +5V / VBUS and GND markings; physical terminal order may differ.</text>
<rect x="45" y="150" width="255" height="170" rx="15" fill="#e6e2cc" stroke="#a3ad9b"/>
<text x="76" y="198">5V USB-A brick</text><text x="76" y="227" class="small">Preferably rated 2A</text>
<rect x="284" y="205" width="18" height="58" fill="#293f34"/><text x="77" y="291" class="small">USB port on this side →</text>
<rect x="296" y="214" width="64" height="40" fill="#b9c4ba" stroke="#5d7060"/>
<rect x="348" y="196" width="114" height="77" rx="7" fill="#34463a"/>
<rect x="453" y="164" width="115" height="153" rx="3" fill="#79a58a" stroke="#345743"/>
<g fill="#b8c7b9" stroke="#355640" stroke-width="2">
<circle cx="482" cy="187" r="9"/><circle cx="482" cy="221" r="9"/><circle cx="482" cy="255" r="9"/><circle cx="482" cy="289" r="9"/>
</g><g stroke="#355640" stroke-width="2"><path d="M476 187h12M476 221h12M476 255h12M476 289h12"/></g>
<g fill="#293f34"><circle cx="563" cy="187" r="5"/><circle cx="563" cy="221" r="5"/><circle cx="563" cy="255" r="5"/><circle cx="563" cy="289" r="5"/></g>
<text x="340" y="143" class="small">USB-A male adapter plugs into the port</text>
<rect x="806" y="135" width="270" height="200" rx="8" fill="#f0eddf" stroke="#acb7a4"/>
<text x="829" y="167">Breadboard strips</text>
<path d="M828 201h222" class="wire" stroke="#b94a3f"/><path d="M828 289h222" class="wire" stroke="#33433c"/>
<path d="M568 187h70q25 0 25 14h166" class="wire" stroke="#b94a3f"/>
<path d="M568 289h261" class="wire" stroke="#33433c"/>
<text x="688" y="185" class="small">+5V / VCC / VBUS</text><text x="701" y="276" class="small">GND / −</text>
<text x="596" y="232" class="small">D+ and D−:</text><text x="596" y="253" class="small">leave empty</text>
<text x="831" y="232" class="small">Row 1 (A–E): +5V loads</text>
<text x="831" y="315" class="small">Row 3 (A–E): common GND</text>
<text x="38" y="383">Wires leave the green screw-terminal block. The brick has no added top connections.</text>
<text x="38" y="414">The MacBook separately powers/programs the ESP32 through USB-C. Grounds are shared.</text>
<text x="38" y="453" class="small">Unplug while wiring; clamp suitable solid jumper ends securely. AC input is omitted; do not modify the brick.</text>
</svg>
